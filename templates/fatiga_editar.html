{% extends "base.html" %}
{% block title %}Editar Fatiga{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h1 class="mb-1">Editar Registro de Fatiga / Pausas</h1>
        <div class="text-muted">Reporte #{{ r.id }} | ID Registro: {{ item.id }}</div>
    </div>
    <a href="{{ url_for('secciones.fatiga', reporte_id=r.id) }}" class="btn btn-outline-secondary">
        🔙 Volver
    </a>
</div>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form method="POST" class="card card-body">
    <div class="row g-2">
        <div class="col-md-4">
            <label class="form-label">Reportes de Sueño</label>
            <input type="number" class="form-control" name="reportes_sueno" min="0"
                value="{{ request.form.get('reportes_sueno', item.reportes_sueno) }}" required>
        </div>

        <div class="col-md-4">
            <label class="form-label">Pausas Activas</label>
            <input type="number" class="form-control" name="pausas_activas" min="0"
                value="{{ request.form.get('pausas_activas', item.pausas_activas) }}" required>
        </div>
    </div>

    <div class="mt-3">
        <button type="submit" class="btn btn-success">💾 Guardar cambios</button>
    </div>
</form>
{% endblock %}
