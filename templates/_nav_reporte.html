<div class="nav-reporte-wrap">
  {% set _inline = nav_inline|default(false) %}

  <div class="nav-reporte-wrap {% if _inline %}nav-reporte-wrap-inline{% endif %}">
    <div class="{% if _inline %}nav-reporte-bar{% else %}nav-reporte-fixed{% endif %}">

      <!-- Inicio: vuelve a la lista de reportes -->
      <a class="btn btn-sm btn-outline-primary" href="/reportes" title="Inicio">
        🏠 <span class="d-none d-md-inline">Inicio</span>
      </a>

      <!-- Secciones (Dashboard): vuelve al dashboard del reporte -->
      {% if r.estado == 'ABIERTO' %}
      <a class="btn btn-sm btn-outline-primary" href="/reportes/{{ r.id }}" title="Secciones">
        🗃️ <span class="d-none d-md-inline">Secciones</span>
      </a>
      {% endif %}

      <!-- Botones de Impresión/PDF (Solo si cerrado) -->
      {% if r.estado == "CERRADO" %}
      <a class="btn btn-sm btn-outline-primary" href="{{ url_for('reportes.reporte_pdf', reporte_id=r.id) }}"
        target="_blank">
        📄 PDF
      </a>
      <button class="btn btn-sm btn-outline-success" onclick="sharePDF('{{ url_for('reportes.reporte_pdf', reporte_id=r.id) }}', 'RCT_{{ r.mina }}_{{ r.fecha }}_{{ r.turno }}.pdf', this)" title="Compartir">
        📤 <span class="d-none d-md-inline">Compartir</span>
      </button>
      {% endif %}

      <!-- Estado del reporte -->
      {% if r.estado == "ABIERTO" %}
      <span class="badge bg-success">ABIERTO</span>
      {% else %}
      <span class="badge bg-secondary">CERRADO</span>
      {% endif %}

    </div>
  </div>

</div>
